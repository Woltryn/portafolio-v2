<section class="contact" id="contato">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-tag">Contato</span>
      <h2 class="section-title">Vamos Trabalhar Juntos</h2>
      <p class="section-subtitle">Tem um projeto em mente ou quer conversar sobre oportunidades? Fale comigo.</p>
    </div>

    <div class="contact-grid">
      <div class="contact-info" appReveal>
        <h3 class="contact-title">Informações de Contato</h3>
        <div class="contact-item">
          <div class="contact-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <div>
            <span class="contact-label">Email</span>
            <a href="mailto:j.jimenez.dev7@gmail.com" class="contact-value">j.jimenez.dev7&#64;gmail.com</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">
            <i class="fas fa-phone"></i>
          </div>
          <div>
            <span class="contact-label">Telefone</span>
            <a href="tel:+5541995401983" class="contact-value">+55 41 99540-1983</a>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div>
            <span class="contact-label">Localização</span>
            <span class="contact-value">Curitiba, PR — Brasil</span>
          </div>
        </div>

        <div class="social-links">
          @for (social of socials; track social.name) {
            <a [href]="social.url" target="_blank" rel="noopener" class="social-link"
               [attr.aria-label]="social.name">
              <i [class]="social.icon"></i>
            </a>
          }
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit()" #contactForm="ngForm" appReveal>
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo"
                 ngModel #nome="ngModel" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu&#64;email.com"
                 ngModel #email="ngModel" required email />
        </div>
        <div class="form-group">
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" name="assunto" placeholder="Sobre o que quer falar?"
                 ngModel #assunto="ngModel" required />
        </div>
        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5"
                    placeholder="Escreva sua mensagem..."
                    ngModel #mensagem="ngModel" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-submit"
                [disabled]="nome.invalid || email.invalid || assunto.invalid || mensagem.invalid">
          <i class="fas fa-paper-plane"></i>
          Enviar Mensagem
        </button>
      </form>
    </div>
  </div>
</section>
