<section class="education" id="formacao">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-tag">Educação</span>
      <h2 class="section-title">Formação Acadêmica</h2>
    </div>

    <div class="education-grid">
      @for (item of education; track item.course) {
        <div class="education-card" appReveal appTiltCard>
          <div class="education-icon">
            <i class="fas fa-graduation-cap"></i>
          </div>
          <div class="education-content">
            <div class="education-type">{{ item.type }}</div>
            <h3 class="education-course">{{ item.course }}</h3>
            <p class="education-school">{{ item.school }}</p>
            <span class="education-period">
              <i class="far fa-calendar-alt"></i>
              {{ item.period }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
