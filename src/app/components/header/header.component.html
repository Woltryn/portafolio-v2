<header [class.scrolled]="scrolled()">
  <div class="header-inner">
    <a href="#inicio" class="logo" (click)="closeMenu()">
    </a>

    <nav [class.open]="menuOpen()">
      <a href="#inicio" [class.active]="isActive('inicio')" (click)="closeMenu()">Início</a>
      <a href="#sobre" [class.active]="isActive('sobre')" (click)="closeMenu()">Sobre Mim</a>
      <a href="#habilidades" [class.active]="isActive('habilidades')" (click)="closeMenu()">Habilidades</a>
      <a href="#experiencia" [class.active]="isActive('experiencia')" (click)="closeMenu()">Experiência</a>
      <a href="#formacao" [class.active]="isActive('formacao')" (click)="closeMenu()">Formação</a>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()" aria-label="Menu">

    </button>
  </div>
