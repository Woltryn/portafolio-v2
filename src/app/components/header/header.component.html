<header [class.scrolled]="scrolled()">
  <div class="header-inner">
    <a href="#inicio" class="logo" (click)="closeMenu()" aria-label="Jose A. Jimenez R. — Início">
    </a>

    <nav id="primary-navigation" [class.open]="menuOpen()" aria-label="Navegação principal">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <button class="hamburger"
            type="button"
            (click)="toggleMenu()"
            [class.active]="menuOpen()"
            [attr.aria-expanded]="menuOpen()"
            aria-controls="primary-navigation"
            aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
