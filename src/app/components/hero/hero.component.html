<section class="hero" id="inicio">
  <div class="container hero-grid">
    <div class="hero-content" appScrollReveal="fade-up">
      <p class="hero-greeting">Olá, eu sou</p>
      <h1 class="hero-name">Jose Jimenez R<span class="accent">.</span></h1>
      <h2 class="hero-title">
        <span class="sr-only">Desenvolvedor Back-End Java — Spring Boot, APIs REST e Microsserviços</span>
        <span #typingText class="typing-text" aria-hidden="true"></span><span class="typing-cursor" aria-hidden="true">|</span>
      </h2>
      <p class="hero-subtitle">
        Spring Boot · APIs REST · Microsserviços
      </p>
      <div class="hero-actions">
        <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
          <i class="fab fa-whatsapp"></i>
          Fale Comigo
        </a>
        <a [href]="cvUrl" target="_blank" rel="noopener" class="btn btn-outline">
          <i class="fas fa-download"></i>
          Baixar CV
        </a>
      </div>
      <div class="hero-info">
        <span><i class="fas fa-map-marker-alt"></i> Curitiba, PR</span>
        <span><i class="fas fa-envelope"></i> j.jimenez.dev7&#64;gmail.com</span>
      </div>
    </div>
    <div class="hero-image" appScrollReveal="zoom" [revealDelay]="120">
      <div class="image-wrapper">
        <img src="assets/foto-profissional.png"
             alt="Jose Antonio Jimenez Rivero"
             width="540"
             height="540"
             decoding="async"
             fetchpriority="high" />
        <div class="image-border"></div>
      </div>
      <div class="hero-badge">
        <i class="fas fa-code"></i>
        <span>+3 anos de experiência</span>
      </div>
    </div>
  </div>
</section>
